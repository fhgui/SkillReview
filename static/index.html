<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="token" content="__TOKEN__">
<title>Skill Review</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b5bdb'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
 <div class="bar1">
  <div class="brand" title="Skill Review"><span class="mark"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></div>
  <div class="stabs" id="skillTabs" role="tablist" aria-label="Open skills"></div>
  <button class="stab add" data-act="add-skill" title="Open another skill  [+]"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Add skill</span></button>
  <button class="agent-pill" id="agentPill" title="Background agents"><span class="dot" id="agentDot"></span><span class="label" id="agentText">Agents</span></button>
  <button class="net-pill" id="netPill" hidden></button>
  <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
 </div>
 <div class="bar2">
  <nav class="tabs" id="tabs" aria-label="Views"></nav>
  <div class="skillinfo" id="skillInfo"></div>
 </div>
</header>
<div class="layout" id="layout">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"><div class="empty"><div class="spin" style="margin:0 auto"></div><p>Loading…</p></div></main>
</div>
<div id="drawerRoot"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modalRoot"></div>
<script src="/static/app.js"></script>
</body>
</html>
